quarkus.application.name=teasely-api

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Local dev: SQLite file database. Quarkus dev mode uses the dev profile by default;
# qa is kept for compatibility with existing launch configs.
%dev.quarkus.datasource.db-kind=other
%dev.quarkus.datasource.jdbc.driver=org.sqlite.JDBC
%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:./teasely-dev.db
%dev.quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

%qa.quarkus.datasource.db-kind=other
%qa.quarkus.datasource.jdbc.driver=org.sqlite.JDBC
%qa.quarkus.datasource.jdbc.url=jdbc:sqlite:./teasely-dev.db
%qa.quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

# Prod datasource: Quarkus reads QUARKUS_DATASOURCE_JDBC_URL / USERNAME / PASSWORD,
# which docker-entrypoint.sh derives from Railway's single DATABASE_URL at startup.
%prod.quarkus.datasource.db-kind=postgresql

mp.jwt.verify.issuer=teasely-api
smallrye.jwt.new-token.issuer=teasely-api
accounts.jwt.time-to-live=3600
accounts.refresh-token.time-to-live=2592000

%dev.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
%qa.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
%qa.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
%test.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:test-publicKey.pem}
%test.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:test-privateKey.pem}

%prod.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

media.s3.bucket=${AWS_STORAGE_BUCKET_NAME:}
media.s3.region=${AWS_S3_REGION_NAME:us-west-2}
media.presigned-url-duration=${MEDIA_PRESIGNED_URL_DURATION:PT15M}